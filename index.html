<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Коридоры влияния · Го</title>
<style>
:root { color-scheme: light; font: 16px system-ui, sans-serif; color: #282218; background: #f7f3ea; }
body { margin: 0; }
main { max-width: 740px; margin: auto; padding: 16px; }
h1 { font-family: Georgia, serif; font-size: clamp(1.6rem, 5vw, 2.4rem); margin: 0 0 14px; }
nav, .options { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 10px; }
button, select { font: inherit; padding: 6px 10px; border: 1px solid #b9a98d; border-radius: 6px; background: #fffdf7; color: inherit; }
button:disabled { opacity: .45; }
button:focus-visible, select:focus-visible, canvas:focus-visible, input:focus-visible { outline: 2px solid #3159a1; outline-offset: 2px; }
canvas { display: block; width: 100%; height: auto; border-radius: 8px; cursor: crosshair; }
p { margin: 8px 0; }
.legend { color: #544936; font-size: .9rem; }
#status, #point { min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <h1>Коридоры влияния</h1>
  <nav aria-label="История расстановки">
    <button id="first" title="В начало">⏮</button>
    <button id="back">← Назад</button>
    <button id="forward">Вперёд →</button>
    <button id="last" title="В конец">⏭</button>
    <output id="step" aria-live="polite"></output>
    <button id="clear">Очистить</button>
  </nav>
  <div class="options">
    <label>Камень <select id="tool">
      <option value="alternate">Чередовать</option>
      <option value="1">Чёрный</option>
      <option value="2">Белый</option>
      <option value="0">Ластик</option>
    </select></label>
    <label>Модель <select id="model">
      <option value="weighted">Взвешенные диагонали</option>
      <option value="ladder">По исходам ситё</option>
      <option value="geometry">Геометрические коридоры</option>
    </select></label>
    <label><input type="checkbox" id="influence" checked> Влияние</label>
    <label><input type="checkbox" id="mirror" checked> Зеркало</label>
    <label><input type="checkbox" id="numbers"> Числа</label>
  </div>
  <canvas id="board" width="800" height="800" tabindex="0" aria-label="Гобан 19 на 19. Стрелки выбирают пункт, Enter ставит камень."></canvas>
  <p id="point" class="legend"></p>
  <p id="probes" class="legend" title="Крестики / квадратики. 1 — выход, 0 — захват, — неприменимо, ? — не решено."></p>
  <p id="status" class="legend" role="status"></p>
  <p class="legend">Свободная расстановка. Синий — перевес чёрных, красный — белых, фиолетовый — равное ненулевое влияние.</p>
</main>
<script>
'use strict';
const size = 19;
const area = size * size;
const margin = 40;
const spacing = 40;
const letters = 'ABCDEFGHJKLMNOPQRST';
const directions = [[1, 1], [-1, 1], [-1, -1], [1, -1]];
const counts = Array.from({ length: 16 }, (_, mask) =>
  directions.filter((_, index) => mask & (1 << index)).length);
const boundaries = [[0, 0], [0, size - 1], [1, 0], [1, size - 1]];

function corridor(dx, dy) {
  let mask = 0;
  directions.forEach(([a, b], index) => {
    const x = a * dx;
    const y = b * dy;
    if (x >= 0 && y >= 0 && Math.abs(x - y) <= 2) mask |= 1 << index;
  });
  return mask;
}

const extent = 2 * size - 1;
const offset = extent - 1;
const width = extent * 2 - 1;
const kernels = Uint8Array.from({ length: width * width }, (_, index) =>
  corridor(index % width - offset, Math.floor(index / width) - offset));

function kernel(dx, dy) {
  return kernels[(dy + offset) * width + dx + offset];
}

// The inward corridors lose more diagonals as the stone approaches the wall.
function blockedLadderDirections(source, dx, dy) {
  const displacement = [dx, dy];
  let blocked = 0;
  for (const [axis, edge] of boundaries) {
    const distance = Math.abs(source[axis] - edge);
    if (distance > 2) continue;
    const inward = edge === 0 ? 1 : -1;
    const normal = inward * displacement[axis];
    const tangent = displacement[1 - axis];
    const diagonal = Math.abs(tangent) - normal;
    const firstBlocked = distance === 0 ? -1 : distance;
    if (normal < 0 || diagonal < firstBlocked || diagonal > 2) continue;
    const parallel = Math.sign(tangent); // Zero selects both inward directions on the normal axis.
    blocked |= axis === 0 ? kernel(inward, parallel) : kernel(parallel, inward);
  }
  return blocked;
}

function chains(board) {
  const seen = new Uint8Array(area);
  const groups = [];
  board.forEach((color, index) => {
    if (!color || seen[index]) return;
    const queue = [index];
    seen[index] = 1;
    const stones = [];
    for (const point of queue) {
      const x = point % size;
      const y = Math.floor(point / size);
      stones.push([x, y]);
      for (const [nx, ny] of [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]]) {
        if (nx < 0 || nx >= size || ny < 0 || ny >= size) continue;
        const next = ny * size + nx;
        if (board[next] !== color || seen[next]) continue;
        seen[next] = 1;
        queue.push(next);
      }
    }
    groups.push({ color, stones });
  });
  return groups;
}

// A cell has four sectors, one against each side, starting at the top.
const cellSectors = [[0, -1], [1, 0], [0, 1], [-1, 0]];

function makeScreen(source, enemies, allowed = () => 15, realSource = source) {
  const blockers = enemies.map(({ x, y, twoLiberties }) => {
    const dx = x - source[0];
    const dy = y - source[1];
    const adjacent = Math.abs(x - realSource[0]) + Math.abs(y - realSource[1]) === 1;
    const mask = !twoLiberties || adjacent ? kernel(dx, dy) & allowed(dx, dy) : 0;
    return { x, y, mask, twoLiberties };
  }).filter(blocker => blocker.mask);

  return (x, y, directionsMask) => {
    let sectors = directionsMask * 0x1111;
    for (const blocker of blockers) {
      const active = directionsMask & blocker.mask;
      if (!active) continue;
      const dx = x - blocker.x;
      const dy = y - blocker.y;
      const shadow = active & kernel(dx, dy);
      if (!shadow) continue;
      for (let d = 0; d < directions.length; d++) {
        if (!(shadow & (1 << d))) continue;
        const [a, b] = directions[d];
        const offset = a * dx - b * dy;
        if (Math.abs(offset) < 2) {
          sectors &= ~((1 << d) * 0x1111);
        } else if (!blocker.twoLiberties) {
          cellSectors.forEach(([sx, sy], sector) => {
            if (offset * (a * sx - b * sy) < 0) sectors &= ~(1 << (d + sector * 4));
          });
        }
      }
    }
    return sectors;
  };
}

function calculate(board, mirror) {
  const masks = [null, new Uint16Array(area), new Uint16Array(area)];
  const occupied = [null, [], []];
  const groups = chains(board).map(({ color, stones }) => {
    const [x, y] = stones[0];
    const twoLiberties = inspectChain(board, y * size + x).liberties.size === 2;
    for (const [sx, sy] of stones) occupied[color].push({ x: sx, y: sy, twoLiberties });
    return { color, stones, twoLiberties };
  });
  const empty = [];
  board.forEach((color, index) => {
    const x = index % size;
    const y = Math.floor(index / size);
    if (!color) empty.push([index, x, y]);
  });
  for (const { color, stones, twoLiberties } of groups) {
    if (twoLiberties) continue;
    const field = masks[color];
    const enemies = occupied[3 - color];
    const screens = new Map(stones.map(source => [source,
      makeScreen(source, enemies, (dx, dy) => ~blockedLadderDirections(source, dx, dy))]));
    for (const source of stones) {
      const [sx, sy] = source;
      for (const [index, x, y] of empty) {
        const direct = kernel(x - sx, y - sy);
        if (direct) {
          const allowed = direct & ~blockedLadderDirections(source, x - sx, y - sy);
          field[index] |= screens.get(source)(x, y, allowed);
        }
      }
    }
    if (!mirror) continue;
    for (const [axis, edge] of boundaries) {
      const along = 1 - axis;
      for (const source of stones) {
        const ds = Math.abs(source[axis] - edge);
        if (!ds) continue;
        for (const target of stones) {
          const dt = Math.abs(target[axis] - edge);
          if (!dt) continue;
          const line = (source[along] * dt + target[along] * ds) / (ds + dt);
          if (!Number.isInteger(line) ||
              Math.abs(Math.abs(line - source[along]) - ds) > 2 ||
              Math.abs(Math.abs(line - target[along]) - dt) > 2) continue;
          const reflected = target.slice();
          reflected[axis] = 2 * edge - target[axis];
          const reflectedScreen = makeScreen(reflected, enemies, undefined, target);
          for (const [index, x, y] of empty) {
            const dx = x - source[0];
            const dy = y - source[1];
            const direct = kernel(dx, dy);
            if (!direct) continue;
            const blocked = blockedLadderDirections(source, dx, dy);
            if (direct & ~blocked) {
              const realCoverage = screens.get(source)(x, y, direct & ~blocked);
              const reflectedMask = kernel(x - reflected[0], y - reflected[1]) & ~blocked;
              const reflectedCoverage = reflectedScreen(x, y, reflectedMask);
              for (let shift = 0; shift < 16; shift += 4) {
                const sector = 15 << shift;
                if (realCoverage & sector) field[index] |= reflectedCoverage & sector;
              }
            }
          }
        }
      }
    }
  }
  return masks;
}

const CAPTURED = 0;
const ESCAPED = 1;
const INAPPLICABLE = 2;
const UNRESOLVED = 3;
const ladderNames = ['↘', '↙', '↖', '↗'];
const ladderNeighbors = Array.from({ length: area }, (_, p) => {
  const x = p % size;
  const y = Math.floor(p / size);
  return [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]]
    .filter(([nx, ny]) => nx >= 0 && ny >= 0 && nx < size && ny < size)
    .map(([nx, ny]) => ny * size + nx);
});

function inspectChain(board, start) {
  const color = board[start];
  const stones = new Set([start]);
  const liberties = new Set();
  for (const stone of stones) {
    for (const next of ladderNeighbors[stone]) {
      if (!board[next]) liberties.add(next);
      else if (board[next] === color) stones.add(next);
    }
  }
  return { stones, liberties };
}

function playLadderMove(board, point, color) {
  if (board[point]) return null;
  const next = board.slice();
  next[point] = color;
  for (const neighbor of ladderNeighbors[point]) {
    if (next[neighbor] !== 3 - color) continue;
    const chain = inspectChain(next, neighbor);
    if (!chain.liberties.size) for (const stone of chain.stones) next[stone] = 0;
  }
  return inspectChain(next, point).liberties.size ? next : null;
}

function readLadder(board, anchor, runner) {
  const path = new Set();
  let remaining = 256;
  function search(current, defending) {
    if (current[anchor] !== runner) return CAPTURED;
    const chain = inspectChain(current, anchor);
    const n = chain.liberties.size;
    if (!n) return CAPTURED;
    if (n >= 3 || (defending && n >= 2)) return ESCAPED;
    if (--remaining < 0) return UNRESOLVED;
    const key = Number(defending) + ':' + String.fromCharCode(...current);
    if (path.has(key)) return UNRESOLVED;
    path.add(key);
    const moves = new Set(chain.liberties);
    if (defending) {
      for (const stone of chain.stones) {
        for (const neighbor of ladderNeighbors[stone]) {
          if (current[neighbor] !== 3 - runner) continue;
          const enemy = inspectChain(current, neighbor);
          if (enemy.liberties.size === 1) {
            for (const liberty of enemy.liberties) moves.add(liberty);
          }
        }
      }
    }
    const best = defending ? ESCAPED : CAPTURED;
    let result = defending ? CAPTURED : ESCAPED;
    for (const move of moves) {
      const next = playLadderMove(current, move, defending ? runner : 3 - runner);
      if (!next) continue;
      if (!defending && next[anchor] === runner && inspectChain(next, anchor).liberties.size > 1) continue;
      const branch = search(next, !defending);
      if (branch === best) { result = best; break; }
      if (branch === UNRESOLVED) result = UNRESOLVED;
    }
    path.delete(key);
    return result;
  }
  return search(board, true);
}

function probeLadder(board, anchor, runner, sx, sy, phase) {
  const x = anchor % size;
  const y = Math.floor(anchor / size);
  const fx = phase === 0 ? sx : 0;
  const fy = phase === 0 ? 0 : sy;
  const tx = phase === 0 ? 0 : sx;
  const ty = phase === 0 ? sy : 0;
  const blocks = [[-fx, -fy], [-tx, -ty], [tx, ty], [fx - tx, fy - ty]];
  if (board[anchor] && board[anchor] !== runner) return INAPPLICABLE;
  const start = board.slice();
  start[anchor] = runner;
  for (const [dx, dy] of blocks) {
    const nx = x + dx;
    const ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= size || ny >= size) continue;
    const point = ny * size + nx;
    if (start[point] === runner) return INAPPLICABLE;
    start[point] = 3 - runner;
  }

  // Setup stones describe the probe before the first defensive move.
  for (const [dx, dy] of blocks) {
    const nx = x + dx;
    const ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= size || ny >= size) continue;
    if (!inspectChain(start, ny * size + nx).liberties.size) return INAPPLICABLE;
  }
  const chain = inspectChain(start, anchor);
  const forward = x + fx;
  const down = y + fy;
  if (forward < 0 || down < 0 || forward >= size || down >= size ||
      chain.liberties.size !== 1 || !chain.liberties.has(down * size + forward)) {
    return INAPPLICABLE;
  }
  return readLadder(start, anchor, runner);
}

function calculateLadders(board) {
  const probes = [null, [], []];
  const totals = [null, new Uint8Array(area), new Uint8Array(area)];
  for (const color of [1, 2]) {
    for (const [sx, sy] of directions) {
      const matrix = new Uint8Array(area * 2);
      for (let anchor = 0; anchor < area; anchor++) {
        for (let phase = 0; phase < 2; phase++) {
          const outcome = probeLadder(board, anchor, color, sx, sy, phase);
          matrix[anchor * 2 + phase] = outcome;
          if (outcome === ESCAPED) totals[color][anchor]++;
        }
      }
      probes[color].push(matrix);
    }
  }
  return { probes, totals };
}

const rayOffsets = [[0, 2], [0, 1], [1, 1], [1, 0], [2, 0]];

function calculateWeighted(board) {
  const totals = [null, new Uint8Array(area), new Uint8Array(area)];
  const details = directions.map(([dx, dy]) => {
    const ray = new Float64Array(area);
    const sums = new Float64Array(area * rayOffsets.length);
    const votes = new Int8Array(area);
    const inside = (x, y) => x >= 0 && x < size && y >= 0 && y < size;
    const read = (x, y) => inside(x, y) ? ray[y * size + x] : 0;

    // Calculate from the far edge so the continuation is already available.
    for (let row = 0; row < size; row++) {
      const y = dy > 0 ? size - 1 - row : row;
      for (let x = 0; x < size; x++) {
        const index = y * size + x;
        const stone = board[index];
        ray[index] = (stone === 2 ? -1 : stone) + read(x + dx, y + dy) / 2;
      }
    }
    for (let index = 0; index < area; index++) {
      const x = index % size;
      const y = Math.floor(index / size);
      const values = rayOffsets.map(([u, v]) => read(x + u * dx, y + v * dy));
      sums.set(values, index * rayOffsets.length);
      const sum = values.reduce((total, value) => total + value, 0);
      const vote = sum === 0 ? 0 : Math.sign(Math.max(...values) + Math.min(...values));
      votes[index] = vote;
      if (vote) totals[vote > 0 ? 1 : 2][index]++;
    }
    return { sums, votes };
  });
  return { details, totals };
}

const get = id => document.getElementById(id);
const canvas = get('board');
const ctx = canvas.getContext('2d');
let history = [{ board: new Uint8Array(area), next: 1, last: -1 }];
let cursor = 0;
let selected = 9 * size + 9;
let hovered = null;
let totals;
let ladderResults;
let weightedResults;
let geometryMasks;
let calculatedModel;
let calculatedFrame;
let calculatedMirror;
const position = () => history[cursor];
const stoneName = color => color === 1 ? 'чёрный' : 'белый';
const coordinate = index => letters[index % size] + (size - Math.floor(index / size));

function circle(x, y, radius, fill) {
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = fill;
  ctx.fill();
}

function influenceColor(black, white, intensity) {
  const difference = black - white;
  const rgb = difference > 0 ? '46,83,159' : difference < 0 ? '170,46,43' : '118,64,146';
  const alpha = .1 + intensity * (Math.abs(difference) || black);
  return 'rgba(' + rgb + ',' + alpha + ')';
}

function draw() {
  const frame = position();
  const model = get('model').value;
  const isLadder = model === 'ladder';
  get('mirror').disabled = model !== 'geometry';
  const mirror = model === 'geometry' && get('mirror').checked;
  if (frame !== calculatedFrame || mirror !== calculatedMirror || model !== calculatedModel) {
    ladderResults = isLadder ? calculateLadders(frame.board) : null;
    weightedResults = model === 'weighted' ? calculateWeighted(frame.board) : null;
    geometryMasks = model === 'geometry' ? calculate(frame.board, mirror) : null;
    totals = weightedResults?.totals ?? ladderResults?.totals ?? geometryMasks.map(field =>
      field && Float32Array.from(field, mask => cellSectors.reduce((sum, _, sector) =>
        sum + counts[(mask >>> (sector * 4)) & 15], 0) / 4));
    calculatedFrame = frame;
    calculatedMirror = mirror;
    calculatedModel = model;
  }
  const influence = get('influence').checked;
  const numbers = get('numbers').checked;
  ctx.fillStyle = '#eac28b';
  ctx.fillRect(0, 0, 800, 800);
  if (influence) {
    frame.board.forEach((color, index) => {
      if (color) return;
      const black = totals[1][index];
      const white = totals[2][index];
      if (!black && !white) return;
      const x = margin + (index % size) * spacing;
      const y = margin + Math.floor(index / size) * spacing;
      const half = spacing / 2;
      if (geometryMasks && [1, 2].some(color => {
        const mask = geometryMasks[color][index];
        return mask !== (mask & 15) * 0x1111;
      })) {
        const corners = [[-half, -half], [half, -half], [half, half], [-half, half]];
        corners.forEach(([ax, ay], sector) => {
          const shift = sector * 4;
          const b = counts[(geometryMasks[1][index] >>> shift) & 15];
          const w = counts[(geometryMasks[2][index] >>> shift) & 15];
          if (!b && !w) return;
          const [bx, by] = corners[(sector + 1) % corners.length];
          ctx.fillStyle = influenceColor(b, w, .11);
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + ax, y + ay);
          ctx.lineTo(x + bx, y + by);
          ctx.fill();
        });
      } else {
        ctx.fillStyle = influenceColor(black, white, isLadder ? .055 : .11);
        ctx.fillRect(x - half, y - half, spacing, spacing);
      }
    });
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '15px system-ui';
  ctx.fillStyle = '#493521';
  ctx.strokeStyle = '#6c4d30';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let i = 0; i < size; i++) {
    const p = margin + i * spacing;
    ctx.moveTo(margin, p);
    ctx.lineTo(760, p);
    ctx.moveTo(p, margin);
    ctx.lineTo(p, 760);
    ctx.fillText(letters[i], p, 16);
    ctx.fillText(letters[i], p, 785);
    ctx.fillText(size - i, 16, p);
    ctx.fillText(size - i, 785, p);
  }
  ctx.stroke();
  for (const x of [3, 9, 15]) {
    for (const y of [3, 9, 15]) circle(margin + x * spacing, margin + y * spacing, 3, '#493521');
  }
  frame.board.forEach((color, index) => {
    const x = margin + (index % size) * spacing;
    const y = margin + Math.floor(index / size) * spacing;
    if (color) {
      const gradient = ctx.createRadialGradient(x - 6, y - 8, 1, x, y, 19);
      gradient.addColorStop(0, color === 1 ? '#595653' : '#fff');
      gradient.addColorStop(1, color === 1 ? '#151413' : '#d7d3ca');
      circle(x + 1, y + 2, 19, '#684d3a55');
      circle(x, y, 18.5, gradient);
      if (index === frame.last) circle(x, y, 4, color === 1 ? '#fff' : '#282218');
    } else if (influence && numbers) {
      const delta = totals[1][index] - totals[2][index];
      if (!delta && !totals[1][index]) return;
      ctx.fillStyle = '#201d27';
      ctx.font = 'bold 16px system-ui';
      ctx.fillText(delta > 0 ? '+' + delta : delta, x + 9, y - 9);
    }
  });
  const highlight = hovered ?? (document.activeElement === canvas ? selected : null);
  if (highlight !== null) {
    ctx.strokeStyle = '#284c8a';
    ctx.lineWidth = 2;
    ctx.strokeRect(margin + highlight % size * spacing - 19,
      margin + Math.floor(highlight / size) * spacing - 19, 38, 38);
  }
  showPoint(highlight);
}

function showPoint(index) {
  let detail = 'Выберите пункт, чтобы увидеть значения влияния.';
  if (index !== null) {
    const color = position().board[index];
    const black = totals[1][index];
    const white = totals[2][index];
    detail = coordinate(index) + ' · ' + (color ? stoneName(color) + ' камень' :
      'чёрные ' + black + ' · белые ' + white + ' · разность ' + (black - white));
  }
  get('point').textContent = detail;
  const symbols = ['0', '1', '—', '?'];
  const probes = get('probes');
  probes.title = '';
  if (weightedResults && index !== null) {
    const start = index * rayOffsets.length;
    const format = new Intl.NumberFormat('ru', { maximumSignificantDigits: 6 });
    probes.textContent = weightedResults.details.map(({ sums, votes }, d) =>
      ladderNames[d] + ' [' + Array.from(sums.slice(start, start + rayOffsets.length),
        value => format.format(value)).join('; ') + '] → ' + votes[index]).join(' · ');
    probes.title = 'Пять сумм лучей и итоговый голос по каждому направлению.';
    return;
  }
  if (ladderResults) probes.title = 'Крестики / квадратики. 1 — выход, 0 — захват, — неприменимо, ? — не решено.';
  probes.textContent = ladderResults && index !== null ?
    [1, 2].map(color => stoneName(color) + ': ' +
      ladderResults.probes[color].map((matrix, d) => ladderNames[d] + ' ' +
        symbols[matrix[index * 2]] + '/' + symbols[matrix[index * 2 + 1]]).join(' · '))
      .join(' | ') : '';
}

function render() {
  get('step').textContent = 'Шаг ' + cursor + ' из ' + (history.length - 1);
  get('first').disabled = get('back').disabled = cursor === 0;
  get('last').disabled = get('forward').disabled = cursor === history.length - 1;
  get('clear').disabled = !position().board.some(Boolean);
  get('status').textContent = get('tool').value === 'alternate' ?
    'Следующий камень — ' + stoneName(position().next) + '.' : '';
  draw();
}

function goTo(step) {
  cursor = Math.max(0, Math.min(history.length - 1, step));
  render();
}

function record(frame) {
  history.splice(cursor + 1, history.length, frame);
  goTo(cursor + 1);
}

function place(index) {
  const frame = position();
  const mode = get('tool').value;
  const color = mode === 'alternate' ? frame.next : Number(mode);
  if (frame.board[index] === color) return;
  const board = frame.board.slice();
  board[index] = color;
  record({ board, next: color ? 3 - color : frame.next, last: color ? index : -1 });
}

function locate(event) {
  const bounds = canvas.getBoundingClientRect();
  const x = Math.round(((event.clientX - bounds.left) * 800 / bounds.width - margin) / spacing);
  const y = Math.round(((event.clientY - bounds.top) * 800 / bounds.height - margin) / spacing);
  return x >= 0 && x < size && y >= 0 && y < size ? y * size + x : null;
}

canvas.addEventListener('pointermove', event => {
  const point = locate(event);
  if (hovered === point) return;
  hovered = point;
  draw();
});
canvas.addEventListener('pointerleave', () => { hovered = null; draw(); });
canvas.addEventListener('click', event => {
  const point = locate(event);
  if (point === null) return;
  selected = point;
  place(point);
  draw();
});
canvas.addEventListener('focus', draw);
canvas.addEventListener('blur', draw);
canvas.addEventListener('keydown', event => {
  const x = selected % size;
  const y = Math.floor(selected / size);
  switch (event.key) {
    case 'ArrowLeft': if (x > 0) selected--; break;
    case 'ArrowRight': if (x < size - 1) selected++; break;
    case 'ArrowUp': if (y > 0) selected -= size; break;
    case 'ArrowDown': if (y < size - 1) selected += size; break;
    case 'Enter':
    case ' ': place(selected); break;
    default: return;
  }
  event.preventDefault();
  hovered = null;
  draw();
});
get('first').onclick = () => goTo(0);
get('back').onclick = () => goTo(cursor - 1);
get('forward').onclick = () => goTo(cursor + 1);
get('last').onclick = () => goTo(history.length - 1);
get('clear').onclick = () => record({ board: new Uint8Array(area), next: 1, last: -1 });
for (const id of ['tool', 'model', 'influence', 'mirror', 'numbers']) get(id).onchange = render;
render();
</script>
</body>
</html>
